<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      HIER STEHT ABSICHTLICH KEINE Content-Security-Policy MEHR.

      Sie wird vom Main-Prozess als Antwort-Header gesetzt (src/main/index.ts, #3), und
      zwar in zwei Fassungen: Der Entwicklungslauf braucht den HMR-WebSocket, die
      ausgelieferte App nicht. Ein statisches <meta> kann diesen Unterschied nicht
      abbilden - es traegt in beiden Faellen denselben Text und schleppte die
      HMR-Erlaubnis in den Produktivbuild.

      Warum ZWEI Quellen aktiv schaedlich sind und nicht nur unordentlich: Bei mehreren
      Richtlinien gilt die SCHNITTMENGE, jede fuer sich blockiert. Beim Bauen von #9 ist
      das konkret aufgeschlagen - eine Lockerung im Header blieb wirkungslos, weil
      dieses <meta> sie weiter verbot, und die CSP-Verletzung zeigte weiter auf eine
      Richtlinie, die im Header laengst korrigiert war. Gesucht haette man den Fehler an
      der falschen Stelle. (Die Lockerung selbst hat sich danach als unnoetig
      herausgestellt und wurde zurueckgenommen - der Doppel-Ort blieb der eigentliche
      Befund.)

      Dass der Header-Weg traegt, ist gemessen, nicht angenommen: Die Richtlinie
      `base-uri` steht NUR im Header, und ein <base>-Versuch im Renderer wird sowohl im
      Dev-Modus (http://) als auch im Produktivbuild (file://) blockiert.
    -->
    <title>Digital-Signage-Tool</title>
  </head>
  <body>
    <div id="wurzel"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
